# Shopify Theme Check configuration
extends: theme-check:recommended

# Fonts are loaded from Google Fonts by design (Saira / Source Serif 4 / IBM Plex Mono /
# IBM Plex Sans Arabic / Noto Naskh Arabic are not in Shopify's font library).
RemoteAsset:
  enabled: false

# The Engineer's Calculator is one self-contained bundle (53 calculators + Arabic text),
# loaded only on the calculator page template.
AssetSizeJavaScript:
  ignore:
    - sections/main-calculator.liquid
